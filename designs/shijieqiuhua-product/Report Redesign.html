<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研判报告展示区 · 方案对比</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
  /* ── reuse the same design tokens + primitives as index.html ── */
  :root {
    --bg-deep:   #efe8d6; --bg: #f5efe1; --surface: #fffdf8; --surface-2: #faf5ea; --surface-3: #f3ecdc;
    --ink: #17221b; --ink-2: #3d4038; --ink-soft: #6d725f; --ink-faint: #9aa090;
    --brand: #143c2d; --brand-700: #0f2e22; --brand-600: #1c4f3a; --brand-tint: #e8f1e3; --brand-tint-2: #dcecd8; --on-brand: #f8f1df;
    --gold: #c9a86a; --gold-deep: #a8843f; --gold-tint: #f6ecd6;
    --line: #e6dcca; --line-2: #ddd0b8; --line-strong: #cdbd9c;
    --ok: #2e7d32; --info: #1976d2; --warn: #c98a2b; --warn-ink: #8a6d3b; --danger: #b4543b; --danger-ink: #8a523f;
    --c-l1: #2e7d32; --c-l2: #1976d2; --c-l3: #e0962a; --c-l4: #d2603a;
    --r-sm: 9px; --r: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
    --sh-1: 0 1px 2px rgba(32,39,34,.05); --sh-2: 0 6px 18px rgba(32,39,34,.07); --sh-3: 0 18px 44px rgba(32,39,34,.10); --sh-brand: 0 14px 30px rgba(20,60,45,.20);
    --font-sans: "Sora", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  :lang(zh) { line-height: 1.75; }
  h1,h2,h3,h4,p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  .mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
  .grow { flex: 1; min-width: 0; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }

  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 7px; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .tag-green { background: var(--brand-tint-2); color: var(--brand); }
  .tag-gold  { background: var(--gold-tint); color: var(--gold-deep); }
  .tag-info  { background: #e4eefb; color: #1763b8; }
  .tag-warn  { background: #f9efd8; color: var(--warn-ink); }
  .tag-mute  { background: var(--surface-3); color: var(--ink-soft); }
  .conf { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; color: #fff; }
  .conf::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.85); }
  .conf-L1 { background: var(--c-l1); } .conf-L2 { background: var(--c-l2); }
  .conf-L3 { background: var(--c-l3); color: #2a1f08; } .conf-L3::before { background: rgba(0,0,0,.4); }
  .conf-L4 { background: var(--c-l4); }
  .sec-label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--ink-soft); text-transform: uppercase; }
  .sec-label .ic { color: var(--brand-600); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-2); padding: 6px 12px; font-size: 12.5px; font-weight: 600; }

  .verdict { border-radius: var(--r-lg); padding: 18px 20px; background: linear-gradient(160deg, var(--brand-tint), var(--surface)); border: 1px solid var(--brand-tint-2); position: relative; overflow: hidden; }
  .verdict[data-insufficient="true"] { background: linear-gradient(160deg, #f4ebe2, var(--surface)); border-color: #e8d6c6; }
  .verdict-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .verdict-lean { font-size: 22px; font-weight: 800; letter-spacing: -.01em; color: var(--brand-700); }
  .verdict-sum { margin-top: 10px; font-size: 14px; line-height: 1.7; color: var(--ink-2); max-width: 64ch; }
  .prob { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
  .prob-cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
  .prob-cell h4 { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .prob-val { font-family: var(--font-mono); font-size: 21px; font-weight: 700; margin-top: 6px; color: var(--ink); }
  .prob-val small { font-size: 12px; color: var(--ink-faint); font-weight: 500; }
  .prob-bar { height: 6px; border-radius: 999px; background: var(--surface-3); margin-top: 9px; overflow: hidden; }
  .prob-bar i { display: block; height: 100%; border-radius: inherit; }
  .prob-cell[data-lead="true"] { border-color: var(--brand-600); box-shadow: 0 0 0 1px var(--brand-600) inset; }

  .factors { display: flex; flex-direction: column; gap: 9px; }
  .factor { display: grid; grid-template-columns: 150px 1fr auto; align-items: center; gap: 12px; padding: 6px 0; }
  .factor-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .factor-name .gp { font-size: 10px; font-weight: 700; color: var(--ink-faint); }
  .factor-track { height: 22px; border-radius: 7px; background: var(--surface-3); position: relative; overflow: hidden; display: flex; }
  .factor-track .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
  .factor-fill { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; }
  .factor-fill[data-dir="home"] { background: linear-gradient(90deg, var(--brand-600), var(--brand)); right: 50%; }
  .factor-fill[data-dir="away"] { background: linear-gradient(90deg, var(--gold), var(--gold-deep)); left: 50%; }
  .factor-fill[data-dir="neutral"] { background: var(--line-strong); left: 50%; transform: translateX(-50%); }
  .factor-impact { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-soft); min-width: 54px; text-align: right; }
  .factor[data-disabled="true"] { opacity: .5; }

  .evlist { display: flex; flex-direction: column; gap: 8px; }
  .ev { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 13px; background: var(--surface); }
  .ev-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev-src { font-size: 12px; font-weight: 700; color: var(--brand-600); }
  .ev-time { font-size: 11px; color: var(--ink-faint); margin-left: auto; }
  .ev-claim { font-size: 13px; line-height: 1.6; margin-top: 7px; color: var(--ink-2); }
  .ev-meter { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .ev-meter .lab { font-size: 10.5px; color: var(--ink-faint); }
  .meter { width: 64px; height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--brand-600); border-radius: inherit; }

  .cycle { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
  .cycle-step { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface-2); position: relative; }
  .cycle-step[data-st="completed"] { border-color: var(--brand-tint-2); background: var(--brand-tint); }
  .cycle-step[data-st="partial"] { border-color: #ecdcb6; background: var(--gold-tint); }
  .cycle-step[data-st="skipped"] { opacity: .6; }
  .cycle-step h4 { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .cycle-step p { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.55; }

  .finding { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
  .finding:last-child { border-bottom: 0; }
  .finding-ic { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; margin-top: 1px; }
  .finding-ic[data-t="confirmed"] { background: var(--brand-tint-2); color: var(--brand); }
  .finding-ic[data-t="assessment"] { background: var(--gold-tint); color: var(--gold-deep); }
  .finding-body { font-size: 13px; line-height: 1.6; }
  .finding-body .src { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

  .rsec { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
  .rsec-hd { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .rsec-hd h3 { font-size: 14px; font-weight: 700; }
  .rsec-hd .right { margin-left: auto; }
  .rsec-bd { padding: 16px; }
  .report { display: flex; flex-direction: column; gap: 14px; }

  /* ════════════════════════ new, "rr-" scoped: redesign + page shell ════════════════════════ */
  body { background: radial-gradient(1200px 480px at 12% -8%, rgba(20,60,45,.06), transparent 60%), var(--bg); }
  .rr-page { max-width: 1180px; margin: 0 auto; padding: 22px max(16px, 3vw) 60px; }

  .rr-switcher { position: sticky; top: 0; z-index: 10; background: rgba(245,239,225,.88); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 18px; box-shadow: var(--sh-2); }
  .rr-switcher-head { display: flex; align-items: center; gap: 10px; }
  .brand-mark { display: grid; place-items: center; background: linear-gradient(150deg, var(--brand-600), var(--brand-700)); color: var(--on-brand); font-weight: 800; }
  .rr-switcher-tabs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .rr-switch-btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    padding: 8px 14px; border-radius: var(--r); font-size: 13px; font-weight: 600; transition: all .15s var(--ease); }
  .rr-switch-btn:hover { border-color: var(--line-strong); }
  .rr-switch-btn[data-on="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); box-shadow: var(--sh-brand); }

  .rr-canvas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--sh-3); padding: 22px; }

  .rr-strip { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .rr-strip-league { font-size: 11px; font-weight: 700; color: var(--brand-600); text-transform: uppercase; letter-spacing: .04em; }
  .rr-strip-teams { font-size: 16px; font-weight: 700; }
  .rr-strip-teams i { font-style: normal; font-size: 11px; color: var(--ink-faint); margin: 0 6px; font-weight: 700; }
  .rr-strip-meta { font-size: 12px; color: var(--ink-soft); margin-left: auto; }

  .rr-stack { display: flex; flex-direction: column; gap: 16px; }
  .rr-bullets { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.8; color: var(--ink-2); }
  .rr-reason { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-faint); margin-top: 12px; }

  /* tier 2 — confirmed / inferred, always visible */
  .rr-tier2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rr-tier2-col { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 14px 16px; }
  .rr-tier2-hd { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }

  .rr-altnote { display: flex; gap: 10px; padding: 13px 16px; border-radius: var(--r-lg); background: var(--gold-tint); border: 1px solid #ecdcb6; font-size: 13px; color: var(--ink-2); }
  .rr-altnote svg { flex: 0 0 auto; color: var(--gold-deep); margin-top: 2px; }
  .rr-altnote b { display: block; margin-bottom: 4px; color: var(--warn-ink); }
  .rr-altnote ul { margin: 0; padding-left: 16px; line-height: 1.7; }

  /* accordion */
  .rr-acc { display: flex; flex-direction: column; gap: 8px; }
  .rr-acc-item { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
  .rr-acc-item[data-open="true"] { border-color: var(--line-strong); box-shadow: var(--sh-1); }
  .rr-acc-trigger { width: 100%; display: flex; align-items: center; gap: 9px; padding: 13px 16px; background: var(--surface-2); border: none; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .rr-acc-ic { color: var(--brand-600); display: flex; }
  .rr-acc-chev { margin-left: auto; font-family: var(--font-mono); color: var(--ink-faint); font-weight: 400; width: 16px; text-align: center; }
  .rr-acc-body { padding: 16px; border-top: 1px solid var(--line); animation: rrFadeIn .25s var(--ease); }
  @keyframes rrFadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* split (variant B) */
  .rr-split { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  .rr-split-left { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 80px; }
  .rr-split-card { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); padding: 14px 16px; }
  .rr-split-lean { font-size: 16px; font-weight: 800; color: var(--brand-700); margin-bottom: 8px; }
  .rr-split-right { display: flex; flex-direction: column; gap: 10px; }
  .rr-split-right-hd { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; padding: 0 2px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .rr-split-ev { position: relative; }
  .rr-supports { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line); display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; color: var(--brand-600); font-weight: 600; }
  .rr-supports svg { flex: 0 0 auto; margin-top: 2px; }

  .rr-mini-factors { display: flex; flex-direction: column; gap: 8px; }
  .rr-mini-factor { display: flex; flex-direction: column; gap: 4px; }
  .rr-mini-factor span:first-child { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .rr-mini-factor-track { height: 6px; border-radius: 999px; background: var(--surface-3); display: block; overflow: hidden; }
  .rr-mini-factor-track i { display: block; height: 100%; border-radius: inherit; }
  .rr-mini-factor-track i[data-dir="home"] { background: var(--brand-600); }
  .rr-mini-factor-track i[data-dir="away"] { background: var(--gold-deep); }
  .rr-mini-factor-track i[data-dir="neutral"] { background: var(--line-strong); }

  /* tabs (variant C) */
  .rr-tabbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .rr-tab { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface);
    color: var(--ink-soft); padding: 8px 13px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; transition: all .14s var(--ease); }
  .rr-tab[data-on="true"] { background: var(--brand-tint); color: var(--brand); border-color: var(--brand-tint-2); }
  .rr-tabpanel { min-height: 220px; }

  @media (max-width: 860px) {
    .rr-tier2, .prob, .cycle { grid-template-columns: 1fr; }
    .rr-split { grid-template-columns: 1fr; }
    .rr-split-left { position: static; }
  }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="report-redesign.jsx"></script>
</body>
</html>
