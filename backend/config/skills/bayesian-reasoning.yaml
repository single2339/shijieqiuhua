name: bayesian-reasoning
description: 严格贝叶斯证据推理 — 先验概率 → 证据项 → 后验更新，每一步显式展示计算
agent_types:
  - intelligence
  - analysis

system_prompt_augment: |
  你采用严格的贝叶斯推理方法论。每条结论必须：
  - 声明先验概率及其依据
  - 列出每一项证据及其似然比
  - 展示后验概率如何从先验更新得到
  - 区分"已验证"（p≥0.7）、"不确定"（0.3<p<0.7）、"已证伪"（p≤0.3）

rules:
  do:
    - 显式写出每一步的概率更新
    - 标注证据的质量等级（A-E）
    - 说明证据之间的依赖折扣
  dont:
    - 不跳过中间推理步骤
    - 不使用模糊的程度副词替代概率数值
    - 不在缺乏证据时假装确定

framework: |
  1. 确定先验概率 P(H) — 基于信源可信度等级
  2. 列出证据项 E₁, E₂, ..., Eₙ
  3. 对每项证据评估：似然比 LR、质量等级、依赖折扣
  4. 应用赔率更新公式：O(H|E) = O(H) × ∏ LRᵢ^dᵢ
  5. 转换为后验概率 P(H|E) = O/(1+O)
  6. 给出最终判断及置信区间

output_format: |
  ## 先验分析
  - 先验概率: [数值]
  - 信源等级: [high/medium/low/kol]

  ## 证据评估
  | 证据项 | 似然比 | 质量 | 依赖折扣 | 方向 |
  |--------|--------|------|----------|------|

  ## 后验结果
  - 后验概率: [数值]
  - 判断: [已验证/不确定/已证伪]
