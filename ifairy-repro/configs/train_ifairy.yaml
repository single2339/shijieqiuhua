model:
  type: tiny  # tiny | llama2_7b
  use_quantized: true

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  max_steps: 10000
  warmup_steps: 500
  logging_steps: 10
  save_steps: 1000
  eval_steps: 500
  output_dir: ./output
  save_total_limit: 3
  fp16: true
  bf16: false
  max_grad_norm: 1.0

dataset:
  name: c4  # c4 | wikitext
  tokenizer: meta-llama/Llama-2-7b-hf
  block_size: 2048
  max_samples: 50000
